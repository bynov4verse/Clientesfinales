<style>
:root{--a:#22aaff;--bg:#05080d;--card:#0c131d;--card2:#101a27;--line:#1a2535;--tx:#eef3f9;--mut:#8593a6;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{margin:0;background:radial-gradient(900px 480px at 78% -12%,#0f3350,transparent),radial-gradient(700px 400px at -10% 110%,#1a0f3a,transparent),var(--bg) fixed;color:var(--tx);font:1rem/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;min-height:100vh}
[hidden]{display:none!important}
aside{width:216px;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;background:linear-gradient(180deg,#0a111b,#060a10);display:flex;flex-direction:column}
.logo{font:italic 800 1.5rem "Segoe UI",sans-serif;padding:0 10px;letter-spacing:-.5px}.logo span{background:linear-gradient(90deg,var(--a),#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
aside small{display:block;color:var(--mut);padding:0 10px 14px;font-size:.8rem}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--mut);padding:10px 12px;border-radius:12px;font:600 .95rem "Segoe UI",system-ui,sans-serif;cursor:pointer;margin-bottom:3px;transition:.15s}
nav button:hover{color:var(--tx);background:#0c1826}
nav button.on{color:var(--a);border-color:color-mix(in srgb,var(--a) 70%,transparent);background:linear-gradient(90deg,#0a2236,#0a1624);box-shadow:0 6px 24px -12px var(--a)}
nav+nav{margin-top:auto}#out{color:#ff6b81}
section{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:4;background:#05080dd9;backdrop-filter:blur(14px)}
.top h1{margin:0;font:italic 800 1.35rem "Segoe UI",sans-serif;flex:1;text-transform:uppercase;min-width:120px}
main{padding:20px 24px 60px;max-width:1500px;margin:0 auto;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h3{margin:22px 0 10px;font-size:1.05rem;color:#7fd0ff}
input,select,textarea{width:100%;background:#080d14;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
#q{width:240px}
.btn{background:linear-gradient(135deg,var(--a),#7c8cff);color:#021320;border:0;border-radius:11px;padding:8px 14px;font:700 .9rem "Segoe UI",system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 20px -12px var(--a);transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.alt{background:#182231;color:var(--tx);box-shadow:none}.danger{background:#3d1119;color:#ff8da0;box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:0 16px 36px -24px #000,inset 0 1px 0 #ffffff0d}
.stats .card{transition:transform .18s,border-color .18s}.stats .card:hover{transform:translateY(-2px);border-color:var(--a)}
.stats .card::before{content:"";position:absolute;left:16px;right:16px;top:0;height:2px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--a),transparent)}
.card small{color:var(--mut);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
.card h2{margin:4px 0 0;font-size:1.6rem;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}

.row{display:flex;gap:8px;margin-top:16px}.pr{display:flex;gap:8px;margin:6px 0}

  cur = {col, id, pre, obj: o, skip: [id, pre && pre.renovaDe].filter(Boolean)};
  $('#mt').innerHTML = (id ? 'Editar' : 'Nuev' + NOM[col][1]) + ' <span>' + NOM[col][0] + '</span>';
  $('#mf').innerHTML = F[col].map(f => field(f, o[f[0]])).join('') + (col == 'cuentas' ? '<datalist id="dl">' + [...new Set(S.cuentas.map(c => c.servicio))].map(s => `<option value="${esc(s)}">`).join('') + '</datalist><div id="pf"></div>' : '');
  if (col == 'cuentas') pfRows();
  if (col == 'ventas') pmv();
  $('#del').hidden = !id; $('#save').hidden = false;
  $('#modal').hidden = false;
};
const g = k => $('#mf').querySelector(`[name=${k}]`);
function pfRows() {
  const pf = $('#pf'), old = [...pf.querySelectorAll('.pr')].map(r => [r.children[0].value, r.children[1].value]);
  const base = old.length ? old : (cur.obj.perfiles || []).map(p => [p.nombre, p.pin]);
  if (g('modo').value != 'perfiles') { pf.innerHTML = '<label>' + (g('modo').value == 'individual' ? 'Cada cupo se vende con el perfil, correo y clave del cliente.' : 'Los dispositivos entran por separado, sin perfil ni PIN.') + '</label>'; return; }
  pf.innerHTML = '<label>Perfiles (nombre y PIN)</label>' + Array.from({length: Math.min(+g('cupos').value || 0, 20)}, (_, i) => `<div class="pr"><input placeholder="Perfil ${i + 1}" value="${esc((base[i] || [])[0])}"><input placeholder="PIN" style="max-width:100px" value="${esc((base[i] || [])[1])}"></div>`).join('');
}
function pmv() {
  const mv = g('metodo').value == 'Pago móvil', bs = +g('bsCobrado').value || 0, T = TS();
  $('#bsL').hidden = !mv;
  g('precio').readOnly = mv && bs > 0 && !!T.bcv;
  if (mv && bs > 0 && T.bcv) g('precio').value = (bs / T.bcv).toFixed(2);
  $('#prev').textContent = mv ? (bs > 0 ? (T.bcv && T.p2p ? `= $${(bs / T.bcv).toFixed(2)} al BCV · ${(bs / T.p2p).toFixed(2)} USDT al P2P` : 'Configura las tasas BCV y P2P en Ajustes') : 'Escribe el monto en Bs para calcular el precio en $') : '';
}
window.copiar = id => {
  const v = M.ventas[id], c = cta(v.cuentaId), p = c.perfiles && c.perfiles[v.slot];
  const t = [`*${v.servicio}*`, `Correo: ${v.cCorreo || c.usuario}`, `Clave: ${v.cClave || c.clave}`, p ? `Perfil: ${p.nombre}${p.pin ? ' · PIN: ' + p.pin : ''}` : v.cPerfil ? `Perfil: ${v.cPerfil}` : '', v.venc ? `Vence: ${v.venc}` : ''].filter(Boolean).join('\n');
  navigator.clipboard.writeText(t).then(() => toast('Datos copiados'), () => toast('No se pudo copiar'));

window.ficha = id => {
  const c = cli(id), vs = S.ventas.filter(v => v.clienteId == id).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  cur = {col: 'ficha'};
  $('#mt').innerHTML = 'Ficha <span>' + esc(c.nombre) + '</span>';
  $('#mf').innerHTML = `<div style="grid-column:1/-1"><p style="color:var(--mut)">${esc(c.whatsapp)} ${esc(c.notas)}</p><div class="stats">${[['Compras', vs.length], ['Activos', act().filter(v => v.clienteId == id).length], ['Renovaciones', vs.filter(v => v.renovaDe).length], ['Pagado USDT', money(sum(vs.filter(v => v.cobrado == 'Cobrado'), net))]].map(([a, b]) => `<div class="card"><small>${a}</small><h2>${b}</h2></div>`).join('')}</div><h3>Historial</h3>${vs.map(v => `<p>${v.fecha} · ${esc(v.servicio)} · ${money(v.precio)} · ${v.renovado ? 'renovada' : v.liberada ? 'liberada' : 'vence ' + (v.venc || '—')}</p>`).join('')}</div>`;
  $('#save').hidden = $('#del').hidden = true; $('#modal').hidden = false;
};
window.respaldo = () => {
  const dl = (n, t, ty) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type: ty})); a.download = n; a.click(); };
  const csv = A => { const K = [...new Set(A.flatMap(Object.keys))]; return '\ufeff' + [K.join(','), ...A.map(o => K.map(k => '"' + String(typeof o[k] == 'object' ? JSON.stringify(o[k]) : o[k] ?? '').replace(/"/g, '""') + '"').join(','))].join('\n'); };
  ['ventas', 'clientes', 'cuentas', 'movs'].forEach(c => dl(`novadesk-${c}-${today()}.csv`, csv(S[c]), 'text/csv'));
  dl(`novadesk-respaldo-${today()}.json`, JSON.stringify(S), 'application/json');
};
window.renew = id => {
  const v = S.ventas.find(x => x.id == id);
  openForm('ventas', null, {clienteId: v.clienteId, cuentaId: v.cuentaId, slot: v.slot, precio: v.precio, dias: v.dias || 30, metodo: v.metodo, fecha: today(), venc: addDays(today(), v.dias || 30), cobrado: 'Pendiente', renovaDe: id});
};
async function autoTasas(force) {
  const T = TS(); if (!force && Date.now() - (T.ts || 0) < 6e5) return;
  const out = {}, f = (u, o) => fetch(u, o).then(r => r.json());
  try { const d = await f('https://ve.dolarapi.com/v1/dolares/oficial'); out.bcv = +(d.promedio || d.venta || d.compra || 0); } catch (e) {}
  try {
    const d = await f('https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({asset: 'USDT', fiat: 'VES', tradeType: 'BUY', page: 1, rows: 10, publisherType: null, payTypes: []})});
    const p = d.data.map(x => +x.adv.price).filter(Boolean).sort((a, b) => a - b); out.p2p = p[p.length >> 1]; out.src = 'Binance P2P';
  } catch (e) {}
  if (!out.p2p) try { const d = await f('https://ve.dolarapi.com/v1/dolares/paralelo'); out.p2p = +(d.promedio || d.venta || d.compra || 0); out.src = 'Dólar paralelo (DolarAPI)'; } catch (e) {}
  const d = {}; if (out.bcv) d.bcv = out.bcv; if (out.p2p) { d.p2p = out.p2p; d.fuenteP2p = out.src; }
  if (d.bcv || d.p2p) await db.collection('config').doc('tasas').set({...d, ts: Date.now(), fecha: today()}, {merge: true});
  if (!out.bcv || !out.p2p) toast('No se pudo obtener ' + (!out.bcv ? 'la tasa BCV' : 'la tasa USDT P2P') + '; escríbela a mano en Ajustes');
  else if (force) toast('Tasas actualizadas');
}
window.salir = () => auth.signOut();
window.usarAuto = () => db.collection('config').doc('tasas').set({manual: false}, {merge: true}).then(() => autoTasas(true));
window.tasa = (k, v) => db.collection('config').doc('tasas').set({[k]: parseFloat(String(v).replace(',', '.')) || 0, fecha: today(), ts: Date.now()}, {merge: true}).then(() => toast('Tasa guardada'));
window.hecha = (id, v) => db.collection('tareas').doc(id).update({hecha: v});
window.toast = toast;
window.acento = c => { document.documentElement.style.setProperty('--a', c); localStorage.acento = c; };
if (localStorage.acento) document.documentElement.style.setProperty('--a', localStorage.acento);
window.cobrar = id => {
  const v = M.ventas[id], L = v.grupo ? S.ventas.filter(x => x.grupo == v.grupo && x.cobrado != 'Cobrado') : [v], b = db.batch();
  if (L.some(x => x.metodo == 'Pago móvil') && !(TS().bcv && TS().p2p)) return toast('Primero configura las tasas BCV y USDT en Ajustes');
  const pm = L.filter(x => x.metodo == 'Pago móvil'), tp = sum(pm, x => x.precio);
  let bt = 0;
  if (pm.length) { bt = parseFloat(String(prompt('Monto cobrado en Bs por pago móvil (' + pm.length + ' servicio' + (pm.length > 1 ? 's' : '') + ')', (tp * TS().bcv).toFixed(2))).replace(',', '.')); if (!(bt > 0)) return toast('Escribe el monto cobrado en Bs'); }
  L.forEach(x => { const bs = x.metodo == 'Pago móvil' ? bt * (x.precio || 0) / (tp || 1) : 0; b.update(db.collection('ventas').doc(x.id), {cobrado: 'Cobrado', fechaCobro: today(), bsCobrado: bs, ...conv({...x, bsCobrado: bs})}); });
  b.commit().then(() => toast(L.length > 1 ? 'Cobro de ' + L.length + ' servicios registrado' : 'Cobro registrado'));
};
window.liberar = id => confirm('¿Liberar este cupo? Quedará disponible para otra venta.') && db.collection('ventas').doc(id).update({liberada: true}).then(() => toast('Cupo liberado'));
$('#add').onclick = () => openForm(AC[tab], null, tab == 'individuales' ? {modo: 'individual'} : undefined);
$('#cancel').onclick = () => $('#modal').hidden = true;
$('#mf').oninput = e => { if (e.target.name == 'bsCobrado') pmv(); };
$('#mf').onchange = e => {
  const n = e.target.name;
  if (cur.col == 'cuentas' && ['cupos', 'modo'].includes(n)) pfRows();
  if (cur.col != 'ventas') return;
  if (n == 'cuentaId') {
    const c = cta(e.target.value);
    cur.obj = {...cur.obj, cuentaId: c.id};
    $('#slotL').hidden = c.modo != 'perfiles'; const pr = S.precios.find(x => (x.servicio || '').toLowerCase() == (c.servicio || '').toLowerCase()); if (pr) { if (!g('precio').readOnly) g('precio').value = pr.precio; g('dias').value = pr.dias || 30; } $('#mf').querySelectorAll('.indL').forEach(l => l.hidden = c.modo != 'individual');
    g('slot').innerHTML = slotOpts(c.id, '', cur.skip);
  }
  if (['cuentaId', 'fecha', 'dias'].includes(n) && g('fecha').value && +g('dias').value) g('venc').value = addDays(g('fecha').value, +g('dias').value);
  if (n == 'metodo') pmv();
};
$('#save').onclick = async () => {
  const d = {};
  $('#mf').querySelectorAll('[name]').forEach(e => d[e.name] = e.type == 'number' ? (e.value === '' ? 0 : +e.value) : e.value.trim());
  if (cur.col == 'clientes' && !d.nombre) return toast('Escribe el nombre del cliente');
  if (cur.col == 'movs' && (!d.descripcion || !d.monto)) return toast('Escribe la descripción y el monto');
  if (cur.col == 'tareas' && !d.titulo) return toast('Escribe la tarea');
  if (cur.col == 'cuentas') {
    if (!d.servicio || !d.usuario) return toast('Falta el servicio o el correo/usuario');
    d.perfiles = d.modo == 'perfiles' ? [...$('#pf').querySelectorAll('.pr')].map(r => ({nombre: r.children[0].value.trim(), pin: r.children[1].value.trim()})) : [];
  }
  if (cur.col == 'ventas') {
    const c = cta(d.cuentaId);
    if (!d.clienteId || !c.id) return toast('Elige el cliente y la cuenta');
    if (c.modo == 'perfiles' && d.slot === '') return toast('Elige el perfil');
    if (c.modo != 'perfiles') { d.slot = ''; if (ocup(c.id, cur.skip).length >= (c.cupos || 0)) return toast('Esa cuenta no tiene dispositivos libres'); }
    d.slot = d.slot === '' ? '' : +d.slot;
    d.servicio = c.servicio; d.costo = (c.costo || 0) / Math.max(1, c.cupos || 1);
    if (!d.fecha) d.fecha = today();
    if (!d.venc && d.dias) d.venc = addDays(d.fecha, d.dias);
    if (d.cobrado == 'Cobrado' && !(cur.obj && cur.obj.fechaCobro)) d.fechaCobro = today();
    if (d.cobrado == 'Cobrado') {
      const o = cur.obj || {};
      if (d.metodo == 'Pago móvil' && !o.tasaBcv && !(TS().bcv && TS().p2p)) return toast('Primero configura las tasas BCV y USDT en Ajustes');
      Object.assign(d, conv(d, o.tasaBcv ? {bcv: o.tasaBcv, p2p: o.tasaP2p} : null));
    }
    if (cur.pre && cur.pre.renovaDe) d.renovaDe = cur.pre.renovaDe;
    cur.otro = d.otro == 'Sí'; delete d.otro;
    d.grupo = (cur.pre && cur.pre.grupo) || (cur.obj && cur.obj.grupo) || (cur.otro ? db.collection('ventas').doc().id : '');
  }
  try {
    const ref = db.collection(cur.col);
    if (cur.id) await ref.doc(cur.id).set(d, {merge: true}); else { d.creado = Date.now(); await ref.add(d); }
    if (d.renovaDe) await db.collection('ventas').doc(d.renovaDe).update({renovado: true});
    $('#modal').hidden = true; toast('Guardado');
    if (cur.col == 'ventas' && cur.otro) openForm('ventas', null, {clienteId: d.clienteId, fecha: d.fecha, cobrado: d.cobrado, metodo: d.metodo, grupo: d.grupo});
  } catch (e) { toast('No se pudo guardar: ' + e.message); }
};
$('#del').onclick = () => confirm('¿Eliminar este registro?') && db.collection(cur.col).doc(cur.id).delete().then(() => { $('#modal').hidden = true; toast('Eliminado'); });

$('#lf').onsubmit = ev => {
  ev.preventDefault(); $('#err').textContent = '';
  auth.signInWithEmailAndPassword($('#em').value, $('#pw').value).catch(() => $('#err').textContent = 'Correo o contraseña incorrectos.');
};
$('#out').onclick = () => auth.signOut();
auth.onAuthStateChanged(u => {
  $('#login').hidden = !!u; $('#app').hidden = $('#side').hidden = !u;
  unsubs.forEach(f => f()); unsubs = []; ready = 0; Object.keys(S).filter(k => k[0] == '_').forEach(k => S[k] = 0);
  if (u) {
    render();
    ['cuentas', 'clientes', 'ventas', 'movs', 'tareas', 'config', 'precios'].forEach(c => unsubs.push(db.collection(c).onSnapshot(
      s => { S[c] = s.docs.map(d => ({id: d.id, ...d.data()})); M[c] = Object.fromEntries(S[c].map(x => [x.id, x])); _A = null; if (!S['_' + c]) { S['_' + c] = 1; ready++; } if (ready == 7 && !S._auto) { S._auto = 1; setTimeout(() => autoTasas(), 600); if (!window._ai) { window._ai = 1; setInterval(() => autoTasas(), 3e5); document.addEventListener('visibilitychange', () => !document.hidden && autoTasas()); } } render(); },
      e => toast('Sin acceso a los datos: ' + e.message))));
  }
});
});
