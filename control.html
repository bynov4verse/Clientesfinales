<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaDesk Control</title>
<style>
:root{--bg:#000;--card:#161616;--line:#2c2c2c;--tx:#f3f3f3;--mut:#9b9b9b;--red:#e11d2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--red);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:19px;letter-spacing:.3px}header b span{color:var(--red)}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);padding:8px 13px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--red);color:#fff}
.bar{display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap}
input,select,textarea{width:100%;background:#0c0c0c;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.bar input{flex:1;min-width:140px;width:auto}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
.alt{background:#333}.danger{background:#7f1d1d}
main{padding:0 14px 40px}
h3{margin:18px 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card small{color:var(--mut)}.card h2{margin:4px 0 0;font-size:22px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
.b{padding:2px 9px;border-radius:99px;font-size:12px;background:#333}
.g{background:#14532d;color:#86efac}.y{background:#78350f;color:#fcd34d}.r{background:#7f1d1d;color:#fca5a5}
a.wa{color:#fff;text-decoration:none;background:#1fa855;padding:6px 9px;border-radius:8px;font-size:12px}
td .btn{padding:5px 9px}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
#login h1{font-size:28px;margin:0 0 4px}#login h1 span{color:var(--red)}
#login p{color:var(--mut);margin:0 0 14px}
#login input{margin-bottom:10px}
#err{color:#fca5a5;margin:8px 0;min-height:18px}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:480px}
.box h3{margin:0 0 6px}
label{display:block;margin:8px 0;color:var(--mut);font-size:12px}
label input,label select,label textarea{margin-top:4px}
.row{display:flex;gap:8px;margin-top:14px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--red);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="login" hidden>
  <h1>Nova<span>Desk</span> Control</h1>
  <p>Acceso privado. Inicia sesión para ver tus ventas.</p>
  <form id="lf">
    <input id="em" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <div id="err"></div>
    <button class="btn" style="width:100%">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <b>Nova<span>Desk</span> Control</b>
    <nav id="nav"></nav>
    <button class="btn alt" id="out">Salir</button>
  </header>
  <div class="bar">
    <input id="q" placeholder="Buscar...">
    <button class="btn" id="add">Agregar</button>
    <button class="btn alt" id="imp">Importar CSV</button>
    <input type="file" id="file" accept=".csv" hidden>
  </div>
  <main id="view"></main>
</div>

<div id="modal" hidden>
  <div class="box">
    <h3 id="mt"></h3>
    <div id="mf"></div>
    <div class="row">
      <button class="btn danger" id="del">Eliminar</button>
      <span style="flex:1"></span>
      <button class="btn alt" id="cancel">Cancelar</button>
      <button class="btn" id="save">Guardar</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAMCDy8PWS36HPnEu1GXHLyDenWbzk5oy8",
  authDomain: "novadesk-control.firebaseapp.com",
  projectId: "novadesk-control",
  storageBucket: "novadesk-control.firebasestorage.app",
  messagingSenderId: "674451509142",
  appId: "1:674451509142:web:f2794950c7d1acd56997b7"
});
const auth = firebase.auth(), db = firebase.firestore();
const $ = s => document.querySelector(s);
const S = {inventario: [], clientes: [], ventas: []};
const T = [['resumen','Resumen'],['ventas','Ventas'],['clientes','Clientes'],['inventario','Inventario']];
const NOM = {clientes:'cliente', ventas:'venta', inventario:'ítem de inventario'};
const PAGOS = ['Pago móvil','Zelle','Binance','PayPal','Efectivo','Otro'];
const F = {
  clientes: [['nombre','Nombre'],['whatsapp','WhatsApp con código de país (ej. 58414...)','tel'],['instagram','Instagram'],['notas','Notas','textarea']],
  inventario: [['servicio','Servicio'],['tipo','Tipo','select',['Alquiler','Dominio']],['tiempo','Tiempo (ej. 1 mes)'],['costo','Costo $','number'],['cuenta','Cuenta (correo)'],['clave','Clave'],['perfil','Perfil'],['pin','PIN'],['idMadre','ID madre'],['corte','Fecha de corte','date'],['estado','Estado','select',['Disponible','Vendido','Vencido','Con problema']]],
  ventas: [['fecha','Fecha de venta','date'],['clienteId','Cliente','cliente'],['inventarioId','Cuenta o perfil del inventario','inv'],['servicio','Servicio'],['dias','Duración en días','number'],['precio','Precio $','number'],['costo','Costo $','number'],['metodo','Método de pago','select',PAGOS],['venc','Vence','date'],['notas','Notas','textarea']]
};
let tab = 'resumen', q = '', cur = {}, unsubs = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (+n || 0).toFixed(2);
const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const iso = d => { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const today = () => iso(new Date());
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return iso(x); };
const diff = d => Math.round((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5);
const cli = id => S.clientes.find(c => c.id == id) || {};
const match = o => !q || JSON.stringify(Object.values(o)).toLowerCase().includes(q);
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2600); };
const badge = v => { if (!v.venc) return ''; const d = diff(v.venc); return d < 0 ? `<span class="b r">Vencida hace ${-d} d</span>` : d <= 3 ? `<span class="b y">Vence en ${d} d</span>` : `<span class="b g">Activa · ${d} d</span>`; };
const wa = (c, v) => 'https://wa.me/' + (c.whatsapp || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(`Hola ${c.nombre}, tu servicio ${v.servicio} vence el ${v.venc}. ¿Quieres renovarlo? NovaDesk`);
const tbl = (h, rows) => rows.length ? `<div class="tw"><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x ?? ''}</td>`).join('')}</tr>`).join('')}</table></div>` : '<div class="card">Aún no hay registros aquí.</div>';
const editBtn = (c, id) => `<button class="btn alt" onclick="openForm('${c}','${id}')">Editar</button>`;

const V = {
  resumen() {
    const vm = S.ventas.filter(v => (v.fecha || '').startsWith(today().slice(0, 7)));
    const vig = S.ventas.filter(v => !v.renovado && v.venc);
    const pend = vig.filter(v => diff(v.venc) >= -30);
    const prox = pend.filter(v => diff(v.venc) <= 7).sort((a, b) => a.venc.localeCompare(b.venc));
    const by = {};
    vm.forEach(v => by[v.servicio || '—'] = (by[v.servicio || '—'] || 0) + (v.precio - v.costo));
    const st = [
      ['Ventas del mes', vm.length], ['Ingresos del mes', money(sum(vm, v => v.precio))],
      ['Ganancia del mes', money(sum(vm, v => v.precio - v.costo))],
      ['Activas', pend.filter(v => diff(v.venc) >= 0).length],
      ['Vencen en 3 días', pend.filter(v => diff(v.venc) >= 0 && diff(v.venc) <= 3).length],
      ['Vencidas sin renovar', pend.filter(v => diff(v.venc) < 0).length],
      ['Disponibles', S.inventario.filter(i => i.estado == 'Disponible').length]
    ];
    return `<div class="stats">${st.map(([a, b]) => `<div class="card"><small>${a}</small><h2>${b}</h2></div>`).join('')}</div>
      <h3>Por renovar (vencidas hasta 30 días y próximas 7)</h3>${ventasTbl(prox)}
      <h3>Ganancia por servicio este mes</h3>${tbl(['Servicio', 'Ganancia'], Object.entries(by).map(([k, v]) => [esc(k), money(v)]))}`;
  },
  ventas() {
    const r = S.ventas.filter(v => match({...v, c: cli(v.clienteId).nombre})).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    return ventasTbl(r);
  },
  clientes() {
    const r = S.clientes.filter(match).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
    return tbl(['Nombre', 'WhatsApp', 'Instagram', 'Compras', 'Total', 'Última compra', ''], r.map(c => {
      const vs = S.ventas.filter(v => v.clienteId == c.id);
      return [esc(c.nombre), esc(c.whatsapp), esc(c.instagram), vs.length, money(sum(vs, v => v.precio)), vs.map(v => v.fecha).sort().pop() || '—', editBtn('clientes', c.id)];
    }));
  },
  inventario() {
    const r = S.inventario.filter(match).sort((a, b) => (a.servicio || '').localeCompare(b.servicio || ''));
    const cl = {Disponible: 'g', Vendido: '', Vencido: 'r', 'Con problema': 'y'};
    return tbl(['Servicio', 'Tipo', 'Tiempo', 'Costo', 'Cuenta', 'Perfil', 'ID madre', 'Corte', 'Estado', ''], r.map(i =>
      [esc(i.servicio), esc(i.tipo), esc(i.tiempo), money(i.costo), esc(i.cuenta), esc(i.perfil), esc(i.idMadre), i.corte || '', `<span class="b ${cl[i.estado] || ''}">${esc(i.estado)}</span>`, editBtn('inventario', i.id)]));
  }
};
function ventasTbl(r) {
  return tbl(['Fecha', 'Cliente', 'Servicio', 'Precio', 'Ganancia', 'Vence', 'Estado', ''], r.map(v => {
    const c = cli(v.clienteId);
    return [v.fecha, esc(c.nombre || '—'), esc(v.servicio), money(v.precio), money(v.precio - v.costo), v.venc || '',
      v.renovado ? '<span class="b">Renovada</span>' : badge(v),
      (c.whatsapp ? `<a class="wa" target="_blank" rel="noopener" href="${wa(c, v)}">WhatsApp</a> ` : '') + editBtn('ventas', v.id) + (v.renovado ? '' : ` <button class="btn alt" onclick="renew('${v.id}')">Renovar</button>`)];
  }));
}
function render() {
  $('#nav').innerHTML = T.map(([k, l]) => `<button class="${k == tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#add').hidden = $('#q').hidden = tab == 'resumen';
  $('#imp').hidden = tab != 'inventario';
  $('#view').innerHTML = V[tab]();
}
window.go = k => { tab = k; q = ''; $('#q').value = ''; render(); };
$('#q').oninput = e => { q = e.target.value.toLowerCase(); render(); };

function field([k, l, t, o], val) {
  val = val ?? '';
  let i;
  if (t == 'select') i = `<select name="${k}">${o.map(x => `<option ${x == val ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  else if (t == 'cliente') i = `<select name="${k}"><option value="">Elige un cliente</option>${[...S.clientes].sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '')).map(c => `<option value="${c.id}" ${c.id == val ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select>`;
  else if (t == 'inv') i = `<select name="${k}"><option value="">Sin vincular</option>${S.inventario.filter(x => x.estado == 'Disponible' || x.id == val).map(x => `<option value="${x.id}" ${x.id == val ? 'selected' : ''}>${esc(x.servicio)} · ${esc(x.perfil || x.cuenta)} · ${esc(x.tiempo)}</option>`).join('')}</select>`;
  else if (t == 'textarea') i = `<textarea name="${k}" rows="2">${esc(val)}</textarea>`;
  else i = `<input name="${k}" type="${t || 'text'}" ${t == 'number' ? 'step="any"' : ''} value="${esc(val)}">`;
  return `<label>${l}${i}</label>`;
}
window.openForm = (col, id, pre) => {
  cur = {col, id, pre};
  const o = id ? S[col].find(x => x.id == id) : {...(col == 'ventas' ? {fecha: today(), dias: 30} : {}), ...pre};
  $('#mt').textContent = (id ? 'Editar ' : 'Nuevo ') + NOM[col];
  $('#mf').innerHTML = F[col].map(f => field(f, o[f[0]])).join('');
  $('#del').hidden = !id;
  $('#modal').hidden = false;
};
window.renew = id => {
  const v = S.ventas.find(x => x.id == id);
  openForm('ventas', null, {clienteId: v.clienteId, servicio: v.servicio, precio: v.precio, costo: v.costo, dias: v.dias || 30, metodo: v.metodo, fecha: today(), venc: addDays(today(), v.dias || 30), renovaDe: id});
};
$('#add').onclick = () => openForm(tab, null);
$('#cancel').onclick = () => $('#modal').hidden = true;
$('#mf').onchange = e => {
  const n = e.target.name, g = k => $('#mf').querySelector(`[name=${k}]`);
  if (n == 'inventarioId') {
    const i = S.inventario.find(x => x.id == e.target.value);
    if (i) { g('servicio').value = i.servicio || ''; g('costo').value = i.costo || 0; g('dias').value = (parseInt(i.tiempo) || 1) * 30; }
  }
  if (['inventarioId', 'fecha', 'dias'].includes(n) && g('venc') && g('fecha').value && +g('dias').value) g('venc').value = addDays(g('fecha').value, +g('dias').value);
};
$('#save').onclick = async () => {
  const d = {};
  $('#mf').querySelectorAll('[name]').forEach(e => d[e.name] = e.type == 'number' ? (e.value === '' ? 0 : +e.value) : e.value.trim());
  if (cur.col == 'clientes' && !d.nombre) return toast('Escribe el nombre del cliente');
  if (cur.col == 'ventas') {
    if (!d.clienteId) return toast('Elige un cliente');
    if (!d.fecha) d.fecha = today();
    if (!d.venc && d.dias) d.venc = addDays(d.fecha, d.dias);
    if (cur.pre && cur.pre.renovaDe) d.renovaDe = cur.pre.renovaDe;
  }
  try {
    const ref = db.collection(cur.col);
    if (cur.id) await ref.doc(cur.id).set(d, {merge: true});
    else { d.creado = Date.now(); await ref.add(d); }
    if (cur.col == 'ventas') {
      if (d.inventarioId) await db.collection('inventario').doc(d.inventarioId).update({estado: 'Vendido'});
      if (d.renovaDe) await db.collection('ventas').doc(d.renovaDe).update({renovado: true});
    }
    $('#modal').hidden = true;
    toast('Guardado');
  } catch (e) { toast('No se pudo guardar: ' + e.message); }
};
$('#del').onclick = () => {
  if (confirm('¿Eliminar este registro?')) db.collection(cur.col).doc(cur.id).delete().then(() => { $('#modal').hidden = true; toast('Eliminado'); });
};

/* Importar inventario desde CSV (descargado de Google Sheets) */
function parseCSV(t) {
  const r = []; let row = [], c = '', k = 0;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (k) { if (ch == '"') { if (t[i + 1] == '"') { c += '"'; i++; } else k = 0; } else c += ch; }
    else if (ch == '"') k = 1;
    else if (ch == ',') { row.push(c); c = ''; }
    else if (ch == '\n') { row.push(c); r.push(row); row = []; c = ''; }
    else if (ch != '\r') c += ch;
  }
  if (c || row.length) { row.push(c); r.push(row); }
  return r;
}
const MES = {ene:0, feb:1, mar:2, abr:3, may:4, jun:5, jul:6, ago:7, sep:8, set:8, oct:9, nov:10, dic:11};
function pd(s) {
  s = (s || '').trim().toLowerCase().replace(/\./g, '');
  let m = s.match(/^(\d{1,2})[-\/ ]([a-z]{3})[a-z]*[-\/ ](\d{4})$/);
  if (m && m[2] in MES) return iso(new Date(+m[3], MES[m[2]], +m[1]));
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? iso(new Date(+m[3], +m[2] - 1, +m[1])) : '';
}
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0];
  if (!f || !confirm('Se agregarán al inventario todas las filas del CSV. ¿Continuar?')) { e.target.value = ''; return; }
  const R = parseCSV(await f.text()), H = R[0].map(h => h.trim().toUpperCase());
  const g = (r, n) => (r[H.indexOf(n)] || '').trim();
  let b = db.batch(), n = 0, tot = 0;
  for (const r of R.slice(1)) {
    if (!g(r, 'SERVICIO') && !g(r, 'CUENTA')) continue;
    b.set(db.collection('inventario').doc(), {
      codc: g(r, 'CODC'), codv: g(r, 'CODV'), servicio: g(r, 'SERVICIO'), tipo: g(r, 'TIPO'), tiempo: g(r, 'TIEMPO'),
      costo: parseFloat(g(r, 'COSTO U').replace(/[^\d.]/g, '')) || 0, cuenta: g(r, 'CUENTA'), clave: g(r, 'CLAVE'),
      perfil: g(r, 'PERFIL'), pin: g(r, 'PIN'), idMadre: g(r, 'ID MADRE'), corte: pd(g(r, 'FECHA DE CORTE')),
      estado: 'Disponible', creado: Date.now()
    });
    tot++;
    if (++n == 400) { await b.commit(); b = db.batch(); n = 0; }
  }
  if (n) await b.commit();
  toast(tot + ' registros importados');
  e.target.value = '';
};

/* Sesión */
$('#lf').onsubmit = ev => {
  ev.preventDefault();
  $('#err').textContent = '';
  auth.signInWithEmailAndPassword($('#em').value, $('#pw').value).catch(() => $('#err').textContent = 'Correo o contraseña incorrectos.');
};
$('#out').onclick = () => auth.signOut();
auth.onAuthStateChanged(u => {
  $('#login').hidden = !!u;
  $('#app').hidden = !u;
  unsubs.forEach(f => f()); unsubs = [];
  if (u) {
    ['inventario', 'clientes', 'ventas'].forEach(c => unsubs.push(db.collection(c).onSnapshot(
      s => { S[c] = s.docs.map(d => ({id: d.id, ...d.data()})); render(); },
      e => toast('Sin acceso a los datos: ' + e.message))));
    render();
  }
});
</script>
</body>
</html>
