<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>NovaDesk · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090a;--b2:#131315;--b3:#1b1b1e;--bd:rgba(255,255,255,.1);--mu:#a1a1aa;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(ellipse at top,#2a0b0d,#09090a 55%) fixed;color:#f4f4f5;min-height:100vh;padding:1rem 1rem 7rem}
.w{max-width:860px;margin:0 auto}button{font-family:inherit;cursor:pointer}
h1{font-size:20px;font-weight:800}h2{font-size:15px;font-weight:800;margin:.2rem 0 .7rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:1rem}.top small{color:var(--mu);font-size:11px;display:block}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:1rem}.tb{flex-shrink:0;border:1px solid var(--bd);background:var(--b3);color:#f4f4f5;border-radius:999px;padding:.5rem 1rem;font-weight:700;font-size:13px}.tb.on{background:var(--red);border-color:var(--red)}
.card{background:var(--b2);border:1px solid var(--bd);border-radius:16px;padding:.9rem;margin-bottom:.9rem}
label{display:block;font-size:11.5px;font-weight:700;margin:.6rem 0 .25rem;color:var(--mu)}
input,select,textarea{width:100%;padding:.6rem .75rem;border-radius:10px;border:1px solid var(--bd);background:var(--b3);color:#f4f4f5;font:500 13.5px 'Plus Jakarta Sans',sans-serif;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--red)}
textarea{min-height:70px;resize:vertical}input[type=color]{padding:.15rem;height:38px;width:70px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}.g4 label{margin-top:.3rem}
.r{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}.r>*{flex:1}.r>.s{flex:none}
.btn{border:1px solid var(--bd);background:var(--b3);color:#f4f4f5;border-radius:10px;padding:.5rem .8rem;font-weight:700;font-size:12.5px}.btn.rd{background:var(--red);border-color:var(--red)}.btn.dg{color:#fca5a5}.btn.s{padding:.45rem .6rem}
.pl{border:1px dashed var(--bd);border-radius:12px;padding:.7rem;margin-top:.6rem}.sh{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}.sh b{flex:1;font-size:15px}
.th{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain;padding:4px}.th.e{background:var(--b3);border:1px solid var(--bd)}
.lr{display:flex;align-items:center;gap:.7rem}.lr input{width:auto}.note{font-size:11.5px;color:var(--mu);margin:.4rem 0;line-height:1.5}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(9,9,10,.92);backdrop-filter:blur(8px);border-top:1px solid var(--bd);padding:.8rem 1rem;z-index:5}.bar .w{display:flex;gap:.6rem}.bar .btn{flex:1;padding:.85rem;font-size:14px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;font-weight:700;padding:.6rem 1rem;border-radius:12px;z-index:9;display:none;font-size:13px}#toast.er{background:#b91c1c}
.lg{max-width:380px;margin:12vh auto 0}.lg .card{padding:1.2rem}.lg h1{margin-bottom:.3rem}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
</style></head><body><div class="w" id="app"></div><div id="toast"></div>
<script src="firebase-config.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const DEF={"tienda": {"nombre": "NovaDesk", "h1": "Lun–Sáb 11:30 a. m. – 11:45 p. m.", "h2": "Dom 2:00 p. m. – 11:45 p. m.", "wa": "584145364023", "ig": "@novadesk_ve", "kick": "ENTRETENIMIENTO SIN LÍMITES", "t1": "Tus plataformas favoritas, ", "t2": "listas hoy mismo", "sub": "Planes de streaming con entrega rápida y soporte por WhatsApp 💬", "color": "#ef4444"}, "cats": ["Streaming", "IPTV", "Canva", "Música", "Herramientas / Edición", "Inteligencia Artificial"], "serv": [{"n": "Netflix", "cat": "Streaming", "color": "#e50914", "planes": [{"label": "Perfil Individual", "precio": 5.4, "oferta": 3.5}, {"label": "Perfil Extra (a tu correo personal)", "precio": 7}, {"label": "Cuenta completa Estándar (3 perfiles)", "precio": 11.5}, {"label": "Cuenta completa Premium (5 perfiles)", "precio": 16}]}, {"n": "Disney+", "cat": "Streaming", "color": "#1a6fff", "planes": [{"label": "Perfil Estándar (2 ESPN)", "precio": 2.5}, {"label": "Perfil Premium Hulu (3 ESPN)", "precio": 3.5}, {"label": "Perfil Premium Premium (7 ESPN)", "precio": 5.5}]}, {"n": "HBOMAX", "cat": "Streaming", "color": "#5822dc", "planes": [{"label": "Perfil Estándar", "precio": 1.8}, {"label": "Perfil Platino (2 dispositivos)", "precio": 3}]}, {"n": "Prime Video", "cat": "Streaming", "color": "#00a8e0", "planes": [{"label": "Perfil Individual", "precio": 3}]}, {"n": "Crunchyroll", "cat": "Streaming", "color": "#f47521", "planes": [{"label": "Perfil Individual", "precio": 2.5}]}, {"n": "Canva", "cat": "Canva", "color": "#00c4cc", "planes": [{"label": "Invitación", "meses": {"1": 0.5, "3": 1.25, "6": 2, "12": 3}, "oferta": {"12": 1.5}}]}, {"n": "Apple TV", "cat": "Streaming", "color": "#c0c0c0", "planes": [{"label": "Dispositivo", "precio": 4}]}, {"n": "CapCut", "cat": "Herramientas / Edición", "color": "#ff3b5c", "planes": [{"label": "Dispositivo", "precio": 7.5}, {"label": "Cuenta completa (2 dispositivos)", "precio": 15}]}, {"n": "ChatGPT", "cat": "Inteligencia Artificial", "color": "#10a37f", "planes": [{"label": "Usuario compartido", "precio": 10.5}, {"label": "Cuenta completa Individual", "precio": 28}]}, {"n": "Gemini AI Pro + 1TB", "cat": "Inteligencia Artificial", "color": "#4285f4", "planes": [{"label": "Invitación", "meses": {"1": 3.5, "3": 7, "12": 14}}]}, {"n": "Spotify Premium", "cat": "Música", "color": "#1db954", "planes": [{"label": "Individual invitada a plan familiar", "precio": 4.5}, {"label": "Individual Total (factura independiente)", "precio": 6}]}, {"n": "FlujoTV", "cat": "IPTV", "color": "#ff6b35", "planes": [{"label": "Dispositivo", "precio": 4.5}, {"label": "Cuenta completa (3 dispositivos)", "precio": 11}]}, {"n": "YouTube Premium", "cat": "Streaming", "color": "#ff0000", "planes": [{"label": "Individual mensual", "precio": 6}]}, {"n": "Telelatino", "cat": "IPTV", "color": "#e31837", "planes": [{"label": "Dispositivo", "precio": 4}]}, {"n": "Office 365", "cat": "Herramientas / Edición", "color": "#e8630a", "planes": [{"label": "5 dispositivos (3 meses de garantía)", "meses": {"12": 20}}]}, {"n": "Plex", "cat": "Streaming", "color": "#e5a00d", "planes": [{"label": "Perfil", "precio": 4.5}, {"label": "Cuenta completa (3 dispositivos)", "precio": 12}]}, {"n": "Deezer", "cat": "Música", "color": "#a238ff", "planes": [{"label": "Individual", "precio": 5}]}, {"n": "TIDAL", "cat": "Música", "color": "#1a1a1a", "planes": [{"label": "Individual", "precio": 5.5}]}], "desc": {"1": 0, "3": 0.1, "6": 0.15, "12": 0.2}, "pagos": [{"n": "Pago Móvil"}, {"n": "Transferencia Bancaria"}, {"n": "Binance Pay"}, {"n": "Wally"}, {"n": "Zinli", "min": 12}, {"n": "Zelle", "min": 15}, {"n": "Uglycash", "min": 15}, {"n": "OKX", "min": 1}, {"n": "Belo", "min": 5}, {"n": "Pesos colombianos (Bre-b)", "min": 4}, {"n": "Pesos chilenos (transferencia)", "min": 6}], "oferta": {"activa": true, "texto": "🔥 Oferta: Netflix Perfil Individual $3.50 · Canva 1 año $1.50", "hasta": "2026-10-17T23:45:00"}, "faq": [{"q": "¿Cómo recibo mi servicio después de pagar?", "a": "Una vez confirmado el pago, recibes las credenciales o la activación directamente por WhatsApp en un plazo de 1 a 24 horas. La mayoría de los servicios se entregan en minutos."}, {"q": "¿Qué pasa si mi servicio falla o se cae?", "a": "Ofrecemos soporte post-venta. Si tu servicio presenta fallas por causas atribuibles al proveedor, te ofrecemos solución o compensación de días. Escríbenos por WhatsApp con el detalle del problema."}, {"q": "¿Puedo compartir mi cuenta con otra persona?", "a": "Depende del tipo de servicio. Los perfiles son de uso personal. Las cuentas completas incluyen múltiples perfiles según el plan. Consulta las especificaciones de cada opción antes de comprar."}, {"q": "¿Cuáles métodos de pago aceptan?", "a": "Aceptamos Bs vía Pago Móvil, Binance Pay, Zinli, Zelle y Wally."}]};
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TABS=["Tienda","Servicios","Pagos","Oferta","Preguntas"],MS=[1,3,6,12],MT={1:"1 mes",3:"3 meses",6:"6 meses",12:"1 año"};
let S=null,tab="Tienda",db,auth,fbOk=window.FB&&FB.projectId&&!/TU_/.test(FB.apiKey||"TU_");
const toast=(m,e)=>{const t=$("#toast");t.textContent=m;t.className=e?"er":"";t.style.display="block";setTimeout(()=>t.style.display="none",e?4500:2200)};
const I=(p,v,o={})=>`<input data-p="${p}" ${o.n?'data-n="1" type="number" step="0.01" min="0"':""} value="${E(v)}" placeholder="${E(o.ph||"")}">`;
const get=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o);
function setP(p,v){const k=p.split("."),l=k.pop(),o=k.reduce((a,x)=>a[x]??={},S);if(v===undefined)delete o[l];else o[l]=v}
const mv=(a,i,d)=>{const j=i+d;if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]]};

function vTienda(){const t=S.tienda;return`<div class="card"><h2>Datos de la tienda</h2>
<div class="lr"><img class="th ${S.logos.tienda?"":"e"}" style="border-radius:50%" ${S.logos.tienda?`src="${S.logos.tienda}"`:""}><div><label style="margin:0">Logo (se ajusta solo)</label><input type="file" accept="image/*" data-logo="tienda"></div></div>
<p class="note">Si no subes un logo nuevo, se mantiene el actual.</p>
<div class="g2"><div><label>Nombre de la tienda</label>${I("tienda.nombre",t.nombre)}</div><div><label>Color principal</label><input type="color" data-p="tienda.color" value="${E(t.color)}"></div>
<div><label>Horario (línea 1)</label>${I("tienda.h1",t.h1)}</div><div><label>Horario (línea 2, opcional)</label>${I("tienda.h2",t.h2)}</div>
<div><label>WhatsApp (con código de país, solo números)</label>${I("tienda.wa",t.wa,{ph:"584141234567"})}</div><div><label>Instagram</label>${I("tienda.ig",t.ig,{ph:"@tienda"})}</div></div></div>
<div class="card"><h2>Portada</h2><label>Texto pequeño</label>${I("tienda.kick",t.kick)}<div class="g2"><div><label>Título (parte blanca)</label>${I("tienda.t1",t.t1)}</div><div><label>Título (parte de color)</label>${I("tienda.t2",t.t2)}</div></div><label>Subtítulo</label>${I("tienda.sub",t.sub)}</div>`}

function vServ(){const o=S.cats.map(c=>`<option>${E(c)}</option>`).join("");
return`<div class="card"><h2>Categorías</h2><label>Una por línea (la sección “Juegos y Recargas” es fija)</label><textarea data-cats>${E(S.cats.join("\n"))}</textarea></div>
<div class="card"><h2>Descuento por cantidad de meses (%)</h2><div class="g4">${[3,6,12].map(m=>`<div><label>${MT[m]}</label><input type="number" min="0" max="90" data-p="desc.${m}" data-n="1" data-pct="1" value="${Math.round((S.desc[m]||0)*100)}"></div>`).join("")}</div>
<p class="note">Aplica a los planes con precio mensual. Los planes “por duración” usan sus propios precios.</p></div>
${S.serv.map((s,i)=>{const cs=S.cats.includes(s.cat)?o:`<option>${E(s.cat)}</option>`+o;
return`<div class="card"><div class="sh"><img class="th ${S.logos.serv[s.n]?"":"e"}" ${S.logos.serv[s.n]?`src="${S.logos.serv[s.n]}"`:""}><b>${E(s.n)||"Nuevo servicio"}</b>
<button class="btn s" data-a="up" data-l="serv" data-i="${i}">↑</button><button class="btn s" data-a="dn" data-l="serv" data-i="${i}">↓</button><button class="btn s dg" data-a="delS" data-i="${i}">Eliminar</button></div>
<div class="g2"><div><label>Nombre</label>${I(`serv.${i}.n`,s.n)}</div><div><label>Categoría</label><select data-p="serv.${i}.cat">${cs.replace(`<option>${E(s.cat)}</option>`,`<option selected>${E(s.cat)}</option>`)}</select></div>
<div><label>Color de la tarjeta</label><input type="color" data-p="serv.${i}.color" value="${E(s.color||"#ef4444")}"></div><div><label>Logo (opcional)</label><input type="file" accept="image/*" data-logo="${E(s.n)}"></div></div>
${s.planes.map((p,j)=>vPlan(i,j,p)).join("")}<button class="btn" style="margin-top:.6rem" data-a="addP" data-i="${i}">+ Agregar plan</button></div>`}).join("")}
<button class="btn rd" data-a="addS">+ Agregar servicio</button>`}

function vPlan(i,j,p){const b=`serv.${i}.planes.${j}`,d=!!p.meses;
return`<div class="pl"><div class="r"><div>${I(`${b}.label`,p.label,{ph:"Nombre del plan"})}</div><button class="btn s" data-a="modo" data-i="${i}" data-j="${j}">${d?"Precio por duración":"Precio por mes"} ⇄</button><button class="btn s dg" data-a="delP" data-i="${i}" data-j="${j}">✕</button></div>
${d?`<div class="g4">${MS.map(m=>`<div><label>${MT[m]} $</label>${I(`${b}.meses.${m}`,p.meses[m]??"",{n:1})}</div>`).join("")}</div><div class="g4">${MS.map(m=>`<div><label>Oferta ${MT[m]}</label>${I(`${b}.oferta.${m}`,p.oferta?.[m]??"",{n:1})}</div>`).join("")}</div>`
:`<div class="g2"><div><label>Precio por mes (USD)</label>${I(`${b}.precio`,p.precio??"",{n:1})}</div><div><label>Precio de oferta (opcional)</label>${I(`${b}.oferta`,typeof p.oferta==="number"?p.oferta:"",{n:1})}</div></div>`}</div>`}

const vPagos=()=>`<div class="card"><h2>Métodos de pago</h2><p class="note">“Mínimo” = ese método solo aplica a pedidos mayores a ese monto en USD (déjalo vacío si no tiene mínimo). Los logos se muestran si existe la imagen <b>img/pago-nombre.jpg</b> en el repositorio.</p>
${S.pagos.map((x,i)=>`<div class="r"><div style="flex:2">${I(`pagos.${i}.n`,x.n,{ph:"Nombre"})}</div><div>${I(`pagos.${i}.min`,x.min??"",{n:1,ph:"Mínimo $"})}</div><button class="btn s" data-a="up" data-l="pagos" data-i="${i}">↑</button><button class="btn s" data-a="dn" data-l="pagos" data-i="${i}">↓</button><button class="btn s dg" data-a="delG" data-i="${i}">✕</button></div>`).join("")}
<button class="btn rd" data-a="addG">+ Agregar método</button></div>`;

const vOferta=()=>{const o=S.oferta;return`<div class="card"><h2>Oferta con cuenta regresiva</h2><div class="lr"><input type="checkbox" data-p="oferta.activa" ${o.activa?"checked":""}><label style="margin:0">Mostrar oferta</label></div>
<label>Texto del banner</label>${I("oferta.texto",o.texto)}<label>Termina el</label><input type="datetime-local" data-p="oferta.hasta" value="${E((o.hasta||"").slice(0,16))}">
<p class="note">Los precios de oferta se ponen en cada plan (pestaña Servicios). Al llegar la fecha, la oferta se oculta sola.</p></div>`};

const vFaq=()=>`<div class="card"><h2>Preguntas frecuentes</h2>${S.faq.map((f,i)=>`<div class="pl"><div class="r"><div>${I(`faq.${i}.q`,f.q,{ph:"Pregunta"})}</div><button class="btn s dg" data-a="delF" data-i="${i}">✕</button></div><textarea data-p="faq.${i}.a">${E(f.a)}</textarea></div>`).join("")}<button class="btn rd" style="margin-top:.7rem" data-a="addF">+ Agregar pregunta</button></div>`;

function render(){const a=$("#app");
if(!fbOk){a.innerHTML=`<div class="lg"><div class="card"><h1>Falta la configuración</h1><p class="note">Abre <b>firebase-config.js</b> y pega tu configuración de Firebase (la misma que usa control.html).</p></div></div>`;return}
if(!auth.currentUser){a.innerHTML=`<div class="lg"><div class="card"><h1>NovaDesk · Admin</h1><p class="note">Entra con tu correo y clave.</p><label>Correo</label><input id="em" type="email" autocomplete="username"><label>Clave</label><input id="pw" type="password" autocomplete="current-password"><button class="btn rd" style="width:100%;margin-top:1rem;padding:.8rem" data-a="login">Entrar</button></div></div>`;return}
if(!S){a.innerHTML=`<p class="note" style="text-align:center;margin-top:30vh">Cargando…</p>`;return}
const v={Tienda:vTienda,Servicios:vServ,Pagos:vPagos,Oferta:vOferta,Preguntas:vFaq}[tab]();
a.innerHTML=`<div class="top"><div><h1>Panel · ${E(S.tienda.nombre)}</h1><small>${E(auth.currentUser.email)}</small></div><div class="r" style="flex:none"><a class="btn" href="index.html" target="_blank" style="text-decoration:none;color:#fff">Ver tienda</a><button class="btn" data-a="out">Salir</button></div></div>
<div class="tabs">${TABS.map(t=>`<button class="tb ${t===tab?"on":""}" data-a="tab" data-t="${t}">${t}</button>`).join("")}</div>${v}
<div class="bar"><div class="w"><button class="btn rd" data-a="save">Guardar y publicar cambios</button></div></div>`}

const cl=o=>JSON.parse(JSON.stringify(o));
function norm(c,l){const d=cl(DEF);S={...d,...c,tienda:{...d.tienda,...(c?.tienda||{})},desc:{...d.desc,...(c?.desc||{})},oferta:{...d.oferta,...(c?.oferta||{})},logos:{tienda:l?.tienda||"",serv:l?.serv||{}}}}
function limpiar(){S.cats=S.cats.filter(Boolean);
for(const s of S.serv){if(!s.n?.trim())return"Hay un servicio sin nombre.";if(!s.planes.length)return`“${s.n}” no tiene planes.`;
 for(const p of s.planes){if(!p.label?.trim())return`“${s.n}” tiene un plan sin nombre.`;
  if(p.meses){for(const m in p.meses)if(!(p.meses[m]>0))delete p.meses[m];if(!Object.keys(p.meses).length)return`“${s.n} · ${p.label}” necesita al menos un precio.`;
   if(p.oferta){for(const m in p.oferta)if(!(p.oferta[m]>0))delete p.oferta[m];if(!Object.keys(p.oferta).length)delete p.oferta}}
  else{if(!(p.precio>0))return`“${s.n} · ${p.label}” necesita un precio.`;if(!(p.oferta>0))delete p.oferta}}
 if(!S.cats.includes(s.cat))S.cats.push(s.cat)}
S.pagos=S.pagos.filter(x=>x.n?.trim());S.pagos.forEach(x=>{if(!(x.min>0))delete x.min});S.faq=S.faq.filter(f=>f.q?.trim());
S.tienda.wa=String(S.tienda.wa||"").replace(/\D/g,"");if(!S.tienda.wa)return"Falta el número de WhatsApp.";
if(S.oferta.hasta&&S.oferta.hasta.length===16)S.oferta.hasta+=":00";return""}
async function guardar(){const e=limpiar();if(e)return toast(e,1);
const{logos,...cfg}=S,lj=JSON.stringify(logos);if(lj.length>900000)return toast("Los logos pesan demasiado; quita alguno.",1);
try{await setDoc(doc(db,"catalogo","config"),{json:JSON.stringify(cfg),updated:serverTimestamp()});await setDoc(doc(db,"catalogo","logos"),{json:lj,updated:serverTimestamp()});toast("✓ Publicado. Ya se ve en la tienda.");render()}
catch(x){toast(x.code==="permission-denied"?"Sin permiso: revisa las reglas de Firestore y tu correo.":"Error: "+x.message,1)}}
async function cargar(){try{const[c,l]=await Promise.all(["config","logos"].map(async d=>{const s=await getDoc(doc(db,"catalogo",d));return s.exists()?JSON.parse(s.data().json):null}));norm(c,l)}catch(x){norm(null,null);toast("No pude leer la base: se muestran los datos actuales de la tienda.",1)}render()}
function logo(file,key){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=160,c=document.createElement("canvas");c.width=c.height=z;const k=Math.min(z/im.width,z/im.height),w=im.width*k,h=im.height*k;c.getContext("2d").drawImage(im,(z-w)/2,(z-h)/2,w,h);const u=c.toDataURL("image/webp",.9);if(key==="tienda")S.logos.tienda=u;else S.logos.serv[key]=u;render()};im.src=r.result};r.readAsDataURL(file)}

document.addEventListener("input",e=>{const t=e.target,p=t.dataset.p;if(!p||!S)return;
let v=t.type==="checkbox"?t.checked:t.dataset.n?(t.value===""?undefined:+t.value):t.value;if(t.dataset.pct)v=(v||0)/100;setP(p,v)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.cats!==undefined){S.cats=t.value.split("\n").map(x=>x.trim()).filter(Boolean);render()}
else if(t.dataset.logo&&t.files[0])logo(t.files[0],t.dataset.logo);else if(t.tagName==="SELECT")render()});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
