${s.planes.map((p,j)=>vPlan(i,j,p)).join("")}<button class="btn" style="margin-top:.7rem" data-a="addP" data-i="${i}">+ Agregar plan</button></div>`:""}</div>`}).join("")}

<div class="g2"><div><label>Desde cuántos servicios distintos</label><select data-p="cauto.min" data-n="1">${[2,3,4,5].map(n=>`<option ${a.min===n?"selected":""}>${n}</option>`).join("")}</select></div><div><label>Rebaja (%)</label>${I("cauto.pct",a.pct,{n:1})}</div></div></div>
<div class="card"><h2>Combos fijos</h2><p class="note">Tú los diseñas: eliges servicios, duración y rebaja. Salen en la pestaña “Combos” de la tienda. Si escribes tu costo, la calculadora te muestra tu ganancia.</p>
${S.combos.map((c,i)=>`<div class="pl"><div class="r"><div style="flex:2">${I(`combos.${i}.nombre`,c.nombre,{ph:"Nombre del combo"})}</div><div class="lr" style="flex:none"><input type="checkbox" data-p="combos.${i}.activo" ${c.activo!==false?"checked":""}><small>Visible</small></div>${IB("delB","🗑",`data-i="${i}"`,"dg")}</div>
<div class="g4"><div><label>Duración</label><select data-p="combos.${i}.m" data-n="1">${MS.map(m=>`<option value="${m}" ${c.m===m?"selected":""}>${MT[m]}</option>`).join("")}</select></div><div><label>Rebaja %</label>${I(`combos.${i}.pct`,c.pct,{n:1})}</div><div><label>Tu costo $ (opc.)</label>${I(`combos.${i}.costo`,c.costo??"",{n:1})}</div></div>
${c.items.map((it,k)=>`<div class="r" style="margin-top:.5rem"><select data-p="combos.${i}.items.${k}.s" data-fx="b,${i},${k}" data-lv="s">${svO(it.s)}</select><select data-p="combos.${i}.items.${k}.l" data-fx="b,${i},${k}">${plO(it.s,it.l)}</select>${IB("delBi","✕",`data-i="${i}" data-j="${k}"`,"dg")}</div>`).join("")}
<button class="btn" style="margin-top:.5rem" data-a="addBi" data-i="${i}">+ Agregar servicio al combo</button><div data-calc="${i}">${calc(c)}</div></div>`).join("")}
<button class="btn rd" style="margin-top:.7rem" data-a="addB">+ Crear combo</button></div>`};

const vOfertas=()=>`<div class="card"><h2>Ofertas por fecha</h2><p class="note">Crea una oferta, elige qué servicios entran y hasta cuándo dura: el aviso con cuenta regresiva se arma solo. Puedes dejar varias guardadas y activar solo las que quieras.</p></div>
${S.camps.map((c,i)=>{const st=!c.activa?["Apagada","off"]:(!c.hasta||new Date(c.hasta)<=new Date())?["Vencida","off"]:["En vivo","on"];
return`<div class="card"><div class="r"><div style="flex:2">${I(`camps.${i}.nombre`,c.nombre,{ph:"Nombre (ej: Fin de semana)"})}</div><span class="pill ${st[1]}">${st[0]}</span>${IB("delC","🗑",`data-i="${i}"`,"dg")}</div>
<div class="g2"><div><label>Termina el</label><input type="datetime-local" data-p="camps.${i}.hasta" value="${E((c.hasta||"").slice(0,16))}"></div><div class="lr" style="padding-top:1.5rem"><input type="checkbox" data-p="camps.${i}.activa" ${c.activa?"checked":""}><label style="margin:0">Activar esta oferta</label></div></div>
${c.items.map((it,k)=>{const p=findP(it.s,it.l);return`<div class="pl"><div class="g2"><select data-p="camps.${i}.items.${k}.s" data-fx="c,${i},${k}" data-lv="s">${svO(it.s)}</select><select data-p="camps.${i}.items.${k}.l" data-fx="c,${i},${k}">${plO(it.s,it.l)}</select></div>
<div class="g2">${p?.meses?`<div><label>Duración</label><select data-p="camps.${i}.items.${k}.m" data-n="1">${Object.keys(p.meses).map(m=>`<option value="${m}" ${it.m==m?"selected":""}>${MT[m]}</option>`).join("")}</select></div>`:""}<div><label>${p?.meses?"Precio en oferta ($)":"Precio por mes en oferta ($)"}</label>${I(`camps.${i}.items.${k}.p`,it.p||"",{n:1})}</div></div>
<div class="r"><small class="note">Normal: ${p?(p.meses?`$${(p.meses[it.m]??0).toFixed(2)}`:`$${(p.precio??0).toFixed(2)}/mes`):"—"}</small>${IB("delCi","✕",`data-i="${i}" data-j="${k}"`,"dg")}</div></div>`}).join("")}
<button class="btn" style="margin-top:.6rem" data-a="addCi" data-i="${i}">+ Agregar servicio a la oferta</button></div>`}).join("")}
<button class="btn rd" data-a="addC">+ Nueva oferta</button>`;

const vPagos=()=>`<div class="card"><h2>Métodos de pago</h2><p class="note">“Mínimo” = ese método solo aplica a pedidos mayores a ese monto en USD (déjalo vacío si no tiene mínimo). Los logos se muestran si existe la imagen <b>img/pago-nombre.jpg</b> en el repositorio.</p>
${S.pagos.map((x,i)=>`<div class="r"><div style="flex:2">${I(`pagos.${i}.n`,x.n,{ph:"Nombre"})}</div><div>${I(`pagos.${i}.min`,x.min??"",{n:1,ph:"Mínimo $"})}</div><button class="btn s" data-a="up" data-l="pagos" data-i="${i}">↑</button><button class="btn s" data-a="dn" data-l="pagos" data-i="${i}">↓</button><button class="btn s dg" data-a="delG" data-i="${i}">✕</button></div>`).join("")}
<button class="btn rd" data-a="addG">+ Agregar método</button></div>`;

const vFaq=()=>`<div class="card"><h2>Preguntas frecuentes</h2>${S.faq.map((f,i)=>`<div class="pl"><div class="r"><div>${I(`faq.${i}.q`,f.q,{ph:"Pregunta"})}</div><button class="btn s dg" data-a="delF" data-i="${i}">✕</button></div><textarea data-p="faq.${i}.a">${E(f.a)}</textarea></div>`).join("")}<button class="btn rd" style="margin-top:.7rem" data-a="addF">+ Agregar pregunta</button></div>`;

function render(){const a=$("#app");
if(!fbOk){a.innerHTML=`<div class="lg"><div class="card"><h1>Falta la configuración</h1><p class="note">Abre <b>firebase-config.js</b> y pega tu configuración de Firebase (la misma que usa control.html).</p></div></div>`;return}
if(!auth.currentUser){a.innerHTML=`<div class="lgw"><div class="lgc"><div class="lgo">N</div><h1>NovaDesk</h1><p class="lgs">Panel de administración</p><div class="fld"><span>✉️</span><input id="em" type="email" placeholder="Correo" autocomplete="username"></div><div class="fld"><span>🔒</span><input id="pw" type="password" placeholder="Clave" autocomplete="current-password"><button class="eye" data-a="eye" type="button">👁</button></div><button class="btn rd lgb" data-a="login">Entrar</button><p class="lgf">Acceso solo para administradores</p></div></div>`;return}
if(!S){a.innerHTML=`<p class="note" style="text-align:center;margin-top:30vh">Cargando…</p>`;return}
const v={Tienda:vTienda,Servicios:vServ,Combos:vCombos,Ofertas:vOfertas,Pagos:vPagos,Preguntas:vFaq}[tab]();
a.innerHTML=`<div class="top"><div><h1>Panel · ${E(S.tienda.nombre)}</h1><small>${E(auth.currentUser.email)}</small></div><div class="r" style="flex:none"><a class="btn" href="index.html?t=${TT}" target="_blank" style="text-decoration:none;color:#fff">Ver tienda</a><button class="btn" data-a="out">Salir</button></div></div>
<div class="tabs">${TABS.map(t=>`<button class="tb ${t===tab?"on":""}" data-a="tab" data-t="${t}">${t}</button>`).join("")}</div>${v}
<div class="bar"><div class="w"><button class="btn rd" data-a="save">Guardar y publicar cambios</button></div></div>`}

const cl=o=>JSON.parse(JSON.stringify(o));
function norm(c,l){const d=cl(DEF);if(!c&&TT!=="novadesk"){d.tienda.nombre=TT;d.tienda.wa="";d.tienda.ig=""}S={...d,...c,tienda:{...d.tienda,...(c?.tienda||{})},desc:{...d.desc,...(c?.desc||{})},cauto:{...d.cauto,...(c?.cauto||{})},logos:{tienda:l?.tienda||"",serv:l?.serv||{}}};delete S.oferta;S.serv.forEach(s=>s.planes.forEach(p=>delete p.oferta));if(!Array.isArray(S.camps))S.camps=d.camps;if(!Array.isArray(S.combos))S.combos=[]}
function limpiar(){S.cats=S.cats.filter(Boolean);
for(const s of S.serv){if(!s.n?.trim())return"Hay un servicio sin nombre.";if(!s.planes.length)return`“${s.n}” no tiene planes.`;
 for(const p of s.planes){if(!p.label?.trim())return`“${s.n}” tiene un plan sin nombre.`;
  if(p.meses){for(const m in p.meses)if(!(p.meses[m]>0))delete p.meses[m];if(!Object.keys(p.meses).length)return`“${s.n} · ${p.label}” necesita al menos un precio.`;
   if(p.oferta){for(const m in p.oferta)if(!(p.oferta[m]>0))delete p.oferta[m];if(!Object.keys(p.oferta).length)delete p.oferta}}
  else{if(!(p.precio>0))return`“${s.n} · ${p.label}” necesita un precio.`;if(!(p.oferta>0))delete p.oferta}}
 if(!S.cats.includes(s.cat))S.cats.push(s.cat)}
S.pagos=S.pagos.filter(x=>x.n?.trim());S.pagos.forEach(x=>{if(!(x.min>0))delete x.min});S.faq=S.faq.filter(f=>f.q?.trim());
S.tienda.wa=String(S.tienda.wa||"").replace(/\D/g,"");if(!S.tienda.wa)return"Falta el número de WhatsApp.";
for(const c of S.camps){c.items=c.items.filter(i=>i.p>0&&findP(i.s,i.l));c.nombre=(c.nombre||"").trim();if(c.activa&&(!c.hasta||!c.items.length))return`La oferta “${c.nombre||"sin nombre"}” está activa pero le falta la fecha o algún servicio con precio.`;if(c.hasta&&c.hasta.length===16)c.hasta+=":00"}
for(const c of S.combos){c.items=c.items.filter(i=>findP(i.s,i.l));if(!c.nombre?.trim())return"Hay un combo sin nombre.";if(c.items.length<2)return`El combo “${c.nombre}” necesita al menos 2 servicios.`;c.pct=Math.min(90,Math.max(0,+c.pct||0))}
S.cauto.pct=Math.min(90,Math.max(0,+S.cauto.pct||0));return""}
async function guardar(){const e=limpiar();if(e)return toast(e,1);
const{logos,...cfg}=S,lj=JSON.stringify(logos);if(lj.length>900000)return toast("Los logos pesan demasiado; quita alguno.",1);
try{await setDoc(doc(db,"tiendas",TT,"catalogo","config"),{json:JSON.stringify(cfg),updated:serverTimestamp()});await setDoc(doc(db,"tiendas",TT,"catalogo","logos"),{json:lj,updated:serverTimestamp()});toast("✓ Publicado. Ya se ve en la tienda.");render()}
catch(x){toast(x.code==="permission-denied"?"Sin permiso: revisa las reglas de Firestore y tu correo.":"Error: "+x.message,1)}}
let TT="";
async function cargar(){try{const em=auth.currentUser.email.toLowerCase(),p=new URLSearchParams(location.search).get("t");
TT=(p||(await getDoc(doc(db,"duenos",em))).data()?.t||"").toLowerCase().replace(/[^a-z0-9-]/g,"");
if(!TT){toast("Tu cuenta aún no tiene tienda asignada. Escríbele al administrador.",1);signOut(auth);return}
const[c,l]=await Promise.all(["config","logos"].map(async d=>{let s=await getDoc(doc(db,"tiendas",TT,"catalogo",d));if(!s.exists()&&TT==="novadesk")s=await getDoc(doc(db,"catalogo",d));return s.exists()?JSON.parse(s.data().json):null}));norm(c,l)}catch(x){norm(null,null);toast("No pude leer la base: se muestran los datos actuales de la tienda.",1)}render()}
function logo(file,key){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=160,c=document.createElement("canvas");c.width=c.height=z;const k=Math.min(z/im.width,z/im.height),w=im.width*k,h=im.height*k;c.getContext("2d").drawImage(im,(z-w)/2,(z-h)/2,w,h);const u=c.toDataURL("image/webp",.9);if(key==="tienda")S.logos.tienda=u;else S.logos.serv[key]=u;render()};im.src=r.result};r.readAsDataURL(file)}

document.addEventListener("input",e=>{const t=e.target,p=t.dataset.p;if(!p||!S)return;
let v=t.type==="checkbox"?t.checked:t.dataset.n?(t.value===""?undefined:+t.value):t.value;if(t.dataset.pct)v=(v||0)/100;setP(p,v);if(p.startsWith("combos."))document.querySelectorAll("[data-calc]").forEach(el=>el.innerHTML=calc(S.combos[el.dataset.calc]))});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if(d.cats!==undefined){S.cats=t.value.split("\n").map(x=>x.trim()).filter(Boolean);render()}
else if(d.fx){const[a,i,k]=d.fx.split(","),it=(a==="c"?S.camps:S.combos)[i].items[k];if(d.lv==="s")it.l=undefined;fix(it,a==="c");render()}
else if(d.logo&&t.files[0])logo(t.files[0],d.logo);else if(t.tagName==="SELECT")render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="pw"||e.target.id==="em"))document.querySelector('[data-a="login"]').click()});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(a==="login"){try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}catch(x){toast("Correo o clave incorrectos.",1)}return}
if(a==="eye"){const p=$("#pw");p.type=p.type==="password"?"text":"password";return}
if(a==="out"){signOut(auth);return}if(!S)return;if(a==="save")return guardar();
const need=()=>{if(S.serv.length)return 0;toast("Primero agrega un servicio.",1);return 1};
switch(a){
case"tab":tab=b.dataset.t;break;
case"tg":OPEN.has(i)?OPEN.delete(i):OPEN.add(i);break;
case"up":case"dn":{const d=a==="up"?-1:1;mv(S[b.dataset.l],i,d);if(b.dataset.l==="serv")OPEN=new Set([i+d]);break}
case"addS":S.serv.push({n:"",cat:S.cats[0]||"General",color:"#ef4444",planes:[{label:"Plan",precio:0}]});OPEN=new Set([S.serv.length-1]);break;
case"delS":if(!confirm(`¿Eliminar “${S.serv[i].n}”?`))return;S.serv.splice(i,1);OPEN=new Set;break;
case"addP":S.serv[i].planes.push({label:"",precio:0});break;
case"delP":S.serv[i].planes.splice(j,1);break;
case"modo":{const p=S.serv[i].planes[j];if(!!p.meses===(b.dataset.md==="1"))return;if(p.meses){p.precio=p.meses[1]??Object.values(p.meses)[0];delete p.meses}else{p.meses={1:p.precio||0};delete p.precio}break}
case"addG":S.pagos.push({n:""});break;case"delG":S.pagos.splice(i,1);break;
case"addF":S.faq.push({q:"",a:""});break;case"delF":S.faq.splice(i,1);break;
case"addC":S.camps.push({id:"c"+Date.now(),nombre:"",activa:true,hasta:"",items:[]});break;
case"delC":S.camps.splice(i,1);break;
case"addCi":if(need())return;S.camps[i].items.push(fix({s:S.serv[0].n,p:0},1));break;
case"delCi":S.camps[i].items.splice(j,1);break;
case"addB":S.combos.push({id:"b"+Date.now(),nombre:"",activo:true,m:1,pct:10,items:[]});break;
case"delB":S.combos.splice(i,1);break;
case"addBi":if(need())return;S.combos[i].items.push(fix({s:S.serv[0].n},0));break;
case"delBi":S.combos[i].items.splice(j,1);break}
render()});

if(fbOk){const app=initializeApp(FB);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{S=null;render();if(u)cargar()})}else render();
</script></body></html>
